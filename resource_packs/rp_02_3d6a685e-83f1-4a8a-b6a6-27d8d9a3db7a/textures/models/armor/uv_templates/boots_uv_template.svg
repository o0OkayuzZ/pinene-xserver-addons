  <rect x="0.5" y="0.5" width="63" height="31" fill="none" stroke="#ffffff" stroke-width="0.7" opacity="0.9"/>
  <text x="2" y="21" font-size="3" fill="#ffffff">BOOTS UV TEMPLATE</text>
