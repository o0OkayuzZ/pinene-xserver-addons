name: PineCD texture resize (one shot)

on:
  push:
    branches:
      - fix/pinecd-texture-size

permissions:
  contents: write

jobs:
  resize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Resize PineCD textures larger than 512 px
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          root = Path("resource_packs/rp_01_1497b511-a764-46d4-b726-dd0f5c5d7784/textures/items")
          files = sorted(root.glob("pinecd_cd_*.png"))
          if not files:
              raise SystemExit("No PineCD textures found")

          changed = []
          print("PineCD texture audit:")
          for path in files:
              before_bytes = path.stat().st_size
              with Image.open(path) as source:
                  source.load()
                  w, h = source.size
                  if max(w, h) <= 512:
                      print(f"KEEP   {path.name}: {w}x{h} ({before_bytes:,} bytes)")
                      continue

                  image = source.copy()
                  if image.mode == "P":
                      image = image.convert("RGBA")
                  elif image.mode not in ("RGB", "RGBA", "L", "LA"):
                      image = image.convert("RGBA")

              image.thumbnail((512, 512), Image.Resampling.LANCZOS)
              image.save(path, format="PNG", optimize=True, compress_level=9)
              after_bytes = path.stat().st_size
              print(
                  f"RESIZE {path.name}: {w}x{h} -> {image.width}x{image.height} "
                  f"({before_bytes:,} -> {after_bytes:,} bytes)"
              )
              changed.append(path.name)

          print(f"Changed {len(changed)} texture(s): {', '.join(changed) if changed else 'none'}")

          for path in files:
              with Image.open(path) as image:
                  w, h = image.size
              if max(w, h) > 512:
                  raise SystemExit(f"Texture still exceeds 512 px: {path} = {w}x{h}")
          PY

      - name: Verify PineCD generated data is unchanged
        run: python tools/pinecd/build.py --check

      - name: Commit optimized textures
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm --ignore-unmatch .github/workflows/pinecd-resize-once.yml
          git add resource_packs/rp_01_1497b511-a764-46d4-b726-dd0f5c5d7784/textures/items/pinecd_cd_*.png
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Optimize PineCD textures to max 512px"
          git push origin HEAD:fix/pinecd-texture-size
