name: Cooking UI and knife durability
on: [push, pull_request]
permissions:
  contents: read
jobs:
  cooking:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node tools/cooking_ui/test_runtime.cjs
      - run: python tools/cooking_ui/validate.py
      - run: python -m unittest discover -s tools/cooking_native -p "test_*.py"
