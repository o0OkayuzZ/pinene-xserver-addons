name: Meshy food placement
on: [push, pull_request]
permissions:
  contents: read
jobs:
  placement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node tools/meshy_food/test_placement.cjs
      - run: python tools/meshy_food/validate.py
