name: Audit Bedrock pack ownership

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit duplicate payloads and pack ownership
        run: python tools/audit_pack_ownership.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test legacy and current PvP abilities
        run: node --test tools/tests/pvp_compatibility.test.mjs
